name: SV Aufheim E2 – Tabellenabgleich

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update_fussball.py"
      - "scripts/test_update_fussball.py"
  schedule:
    # UTC; GitHub kann geplante Läufe bei hoher Auslastung verzögern.
    - cron: "17 6,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aufheim-e2-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check importer logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify and update football data
        run: python3 scripts/update_fussball.py
      - name: Commit only verified changes
        run: |
          if git diff --quiet -- data.js; then
            echo "Official data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update Aufheim E2 standings and fixtures"
          git push
