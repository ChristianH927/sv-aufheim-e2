name: SV Aufheim E2 – Tabellenabgleich

on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update_fussball.py"
      - "scripts/test_update_fussball.py"
  schedule:
    # Alle Angaben in deutscher Ortszeit (Sommer-/Winterzeit automatisch).
    # Montag–Donnerstag: morgendlicher Abgleich und zwei Prüfungen am Abend.
    - cron: "17 7,17,21 * * 1-4"
      timezone: "Europe/Berlin"
    # Freitag: die bisherigen E2-Ligaspiele begannen 16:15–18:00 Uhr.
    # Rund um Spielende und Ergebnismeldung daher stündlich prüfen.
    - cron: "27 7,16,17,18,19,20,21,22 * * 5"
      timezone: "Europe/Berlin"
    # Samstag/Sonntag: zweistündlich vom Vormittag bis in den Abend.
    - cron: "37 9,11,13,15,17,19,21 * * 6,0"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aufheim-e2-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check importer logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify and update football data
        run: python3 scripts/update_fussball.py
      - name: Commit only verified changes
        run: |
          if git diff --quiet -- data.js; then
            echo "Official data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update Aufheim E2 standings and fixtures"
          git push
